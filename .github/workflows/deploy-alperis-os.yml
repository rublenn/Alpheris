name: Deploy Alpheris OS

# Push-triggering is paused: the Netlify account is blocked on exceeded
# credit usage, so every automatic run was just failing. Re-add the
# `push` trigger once billing is resolved, or run this manually via
# workflow_dispatch in the meantime. GitHub Pages (deploy-pages.yml) is
# the live deploy target until then.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ALPHERIS_OS_ROOT: "true"

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --no-build --prod --dir=out --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
