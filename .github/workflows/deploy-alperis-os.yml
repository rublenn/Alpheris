name: Deploy Alpheris OS

on:
  push:
    branches:
      - claude/agency-app-structure-mttifh
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ALPHERIS_OS_ROOT: "true"

      - name: Debug root redirect
        run: |
          echo "--- env in this step ---"
          echo "NEXT_PUBLIC_ALPHERIS_OS_ROOT=$NEXT_PUBLIC_ALPHERIS_OS_ROOT"
          echo "--- grep for redirect digest in out/index.html ---"
          grep -o "NEXT_REDIRECT[a-zA-Z0-9/;]*" out/index.html || echo "NOT FOUND"
          echo "--- grep for marketing title ---"
          grep -o "AlperisMedien[^<]*" out/index.html | head -1 || true

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=out --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
