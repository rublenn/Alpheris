<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="fonts/fonts.css" />

      <a href="#" class="logo">
        <span class="logo__name">Alpheris</span>
        <span class="logo__sub">Medien</span>

      <a href="#work" class="btn btn--primary">View Work</a>
